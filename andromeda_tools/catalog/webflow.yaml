manifest_version: 1
name: webflow
description: Sites, CMS collections, and pages from Webflow.
source: https://developers.webflow.com/mcp/reference/getting-started
transport:
  type: http
  url: https://mcp.webflow.com/mcp
auth:
  type: oauth
suggest:
  keywords: [webflow]
  hosts: [webflow.com]
post_install: |
  Run `andromeda mcp login webflow` to authorize in a browser,
  then start a new session so the tools load.
