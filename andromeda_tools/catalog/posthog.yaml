manifest_version: 1
name: posthog
description: Product analytics, feature flags, and session insights from PostHog.
source: https://posthog.com/docs/model-context-protocol
transport:
  type: http
  url: https://mcp.posthog.com/mcp
auth:
  type: oauth
suggest:
  keywords: [posthog, analytics, feature flag, funnel]
  hosts: [posthog.com, us.posthog.com, eu.posthog.com]
post_install: |
  Run `andromeda mcp login posthog` to authorize in a browser,
  then start a new session so the tools load.
