manifest_version: 1
name: vercel
description: Deployments, logs, and projects from Vercel.
source: https://vercel.com/docs/mcp
transport:
  type: http
  url: https://mcp.vercel.com
auth:
  type: oauth
suggest:
  keywords: [vercel]
  hosts: [vercel.com]
post_install: |
  Run `andromeda mcp login vercel` to authorize in a browser,
  then start a new session so the tools load.
