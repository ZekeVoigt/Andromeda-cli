manifest_version: 1
name: prisma
description: Postgres databases, schemas, and migrations managed by Prisma.
source: https://www.prisma.io/docs
transport:
  type: http
  url: https://mcp.prisma.io/mcp
auth:
  type: oauth
suggest:
  keywords: [prisma, orm, migration, schema]
  hosts: [prisma.io, console.prisma.io]
post_install: |
  Run `andromeda mcp login prisma` to authorize in a browser,
  then start a new session so the tools load.
