manifest_version: 1
name: linear
description: Find, create, and update Linear issues, projects, and comments.
source: https://linear.app/docs/mcp
transport:
  type: http
  url: https://mcp.linear.app/mcp
auth:
  type: oauth
suggest:
  keywords: [linear]
  hosts: [linear.app]
post_install: |
  Run `andromeda mcp login linear` to authorize in a browser,
  then start a new session so the tools load.
