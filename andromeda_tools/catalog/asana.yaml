manifest_version: 1
name: asana
description: Tasks, projects, and goals from your Asana workspace.
source: https://developers.asana.com/docs/using-asanas-mcp-server
transport:
  type: http
  url: https://mcp.asana.com/sse
auth:
  type: oauth
suggest:
  keywords: [asana]
  hosts: [asana.com]
post_install: |
  Run `andromeda mcp login asana` to authorize in a browser,
  then start a new session so the tools load.

  This endpoint speaks server-sent events. Simple replies work; a
  server that streams several frames will be truncated until the
  streaming client lands.
