manifest_version: 1
name: sentry
description: Issues, stack traces, and error context from Sentry.
source: https://docs.sentry.io/product/sentry-mcp/
transport:
  type: http
  url: https://mcp.sentry.dev/mcp
auth:
  type: oauth
suggest:
  keywords: [sentry, stack trace, crash report]
  hosts: [sentry.io]
post_install: |
  Run `andromeda mcp login sentry` to authorize in a browser,
  then start a new session so the tools load.
